<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b1ff5a"/>
      <stop offset="0.5" stop-color="#6cf0ff"/>
      <stop offset="1" stop-color="#9d6cff"/>
    </linearGradient>
    <linearGradient id="headline" x1="70" y1="205" x2="680" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="0.55" stop-color="#d8d9df"/>
      <stop offset="1" stop-color="#9d6cff"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientTransform="translate(965 182) rotate(90) scale(330 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b3df5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6b3df5" stop-opacity="0"/>
